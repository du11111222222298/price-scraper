name: Automated End-to-End Price Scraper

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * *'  # اجرای خودکار هر روز راس ساعت ۸ صبح UTC
  workflow_dispatch:     # امکان اجرای دستی در هر لحظه

jobs:
  scrape-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run End-to-End Scraper Pipeline
        run: |
          python main.py

      - name: Upload Generated Excel & CSV Reports
        uses: actions/upload-artifact@v4
        with:
          name: scraped-market-reports
          path: outputs/
          retention-days: 30
